<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex03 box model</title>
    <style>
        body {
            background-color: #dddddd;
        }
        
    </style>
</head>
<body>
    <div class="frame"><div class="box">1. 기본</div></div>
    <div class="frame"><div class="box pad">2. padding 16px</div></div>
    <div class="frame"><div class="box bd">3. border 4px</div></div>
    <div class="frame"><div class="box mg">4. margin 16px</div></div>
    <div class="frame"><div class="box pad bd mg">5. padding + border + margin</div></div>
    <p>안쪽 여백 · 테두리 · 바깥 여백은 서로 다른 층이다. F12 › Elements › Styles 맨 아래 상자 그림에서 네 값을 볼 수 있다.</p>
</body>
</html>
